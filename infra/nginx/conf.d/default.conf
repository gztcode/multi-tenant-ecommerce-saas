# 生产 nginx 的 /etc/nginx/conf.d/default.conf 覆盖文件（由 docker-compose.prod.yml 挂载）。
#
# ## 为什么需要这个文件
#
# 官方 nginx 镜像自带一块 server_name localhost 的默认 server，entrypoint 还会给
# 它加上 `listen [::]:80;`。它不带 default_server，所以和我们 prod.conf 里的
# `[::]:80 default_server` **不冲突**、容器照常起（实测过，别照抄「会报
# duplicate listen options」的说法）。
#
# 覆盖它的真实理由有两条：
#   1. 它是 `[::]:80` 上的第二个 server（root 是 /usr/share/nginx/html）。
#      `Host: localhost` 或直接用 IP 访问会命中它，拿到欢迎页 200 ——
#      prod.conf 的口径是未知 Host 一律 444 断连（IPv4 上 IP 直访同样是 200，
#      所以这里不是「两族不一致」，而是「两个地址族都漏了欢迎页」）。
#   2. `[::]:80` 的兜底会隐式依赖 prod.conf 里 default_server 那一行永不出错；
#      一旦它被误删，镜像块立刻回退成 IPv6 兜底。
#
# 所以这里把它覆盖成**不含任何 server 块**的占位文件：80 / 443 的
# `default_server` 由 prod.conf 显式承担（IPv4 与 IPv6 各一份）。
#
# ⚠️ 本文件刻意不写任何 listen 指令。镜像的 10-listen-on-ipv6-by-default.sh
#    会尝试用 sed 改 `listen       80;`，虽然它先 touch 发现只读就跳过，
#    但保持「零指令」能让这个前提不依赖脚本实现细节。
