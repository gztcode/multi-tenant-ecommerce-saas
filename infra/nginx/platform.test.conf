# 阶段 1 本地开发用子域名路由
# 使用前把 *.platform.test 指向 127.0.0.1：
#   127.0.0.1 *.platform.test

upstream api_backend {
    server api:3000;
}

upstream storefront_backend {
    server storefront:3000;
}

upstream merchant_admin_backend {
    server merchant-admin:3000;
}

upstream platform_admin_backend {
    server platform-admin:3000;
}

# ---- 阶段 7a 收口 ----
# 常规响应压缩（html 内置在 gzip_types 之外也会压，这里补静态资源类型）
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# 请求体上限（上传走 MinIO presigned 直传，不经网关；10m 兜底防误用）
client_max_body_size 10m;

# 反代读超时显式化（与 nginx 默认一致，防止有人「顺手」调大）
proxy_read_timeout 60s;

# ---- 阶段 11：网关限流 ----
# 按 IP 限流（共享内存 10m ≈ 16 万个 IP 状态）。应用层已有登录限流
# （login-throttle），这里是网关层的第二道闸，主要防扫描器与脚本滥用。
# ⚠️ 直连场景 $binary_remote_addr 就是真实客户端 IP；将来前面加 CDN/LB 时，
#    要配合 set_real_ip_from + real_ip_header 修正，否则限的是 CDN 的 IP。
# ⚠️ 两个阈值都是**保护性默认值**，上线后按真实流量调：
#    - api_general 20r/s burst 40：正常浏览/加购/查询绰绰有余；
#    - api_auth 10r/s burst 20：认证端点从紧。注意三端的 BFF 中转路由
#      也会以「BFF 服务器自己的 IP」打到这里（所有用户共享一个 IP），
#      收得太紧会把正常登录一起拒掉——这是调阈值的下限依据。
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;

# 全站安全响应头（location 内没有自己的 add_header，继承这里的）
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# 未知 Host 一律断连（不给扫描器任何回音，也不落进 storefront）
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# 店铺子域名：<tenant>.platform.test
# 网关从 Host 反推出店铺子域名后注入，覆盖客户端自带的同名头，
# 因此客户端无法伪造「我是哪个店铺」的身份。
server {
    listen 80;
    server_name ~^(?<tenant>[a-z0-9-]+)\.platform\.test$;

    location / {
        proxy_pass http://storefront_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Subdomain $tenant;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js 的 HMR 依赖 WebSocket 升级握手
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ⚠️ **只代理后端自己的版本前缀**。`location /api/` 是最长前缀匹配，
    # 会把 storefront 的 BFF 路由（/api/cart、/api/auth/[...nextauth] 等）
    # 全部抢给 api_backend —— 而后端全局前缀是 /api/v1，这些请求在后端
    # 不存在 → 经网关访问时购物车/登录/下单整体 404（直连 :3001 正常）。
    location /api/v1/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Subdomain $tenant;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 网关限流（阶段 11）：burst 内放行突发，超出直接 503
        limit_req zone=api_general burst=40 nodelay;
        limit_req_status 503;
    }

    # Next.js 的构建产物带内容哈希，可以长期缓存。
    #
    # ⚠️ **本层一旦出现 add_header，就不再继承 server 级的安全头** ——
    #    所以这里把三条安全头原样补回来。
    location /_next/static/ {
        proxy_pass http://storefront_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Subdomain $tenant;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ⚠️ 只用 add_header：再写 `expires` 会产生第二条 Cache-Control。
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

# 中心域名：API 不带店铺身份，显式剥除该头
server {
    listen 80;
    server_name api.platform.test;

    # 认证端点单独限流（阶段 11）：比普通接口更紧
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=20 nodelay;
        limit_req_status 503;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Subdomain "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 这些后端不接受客户端指定的子域名，显式剥除
        proxy_set_header X-Tenant-Subdomain "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=api_general burst=40 nodelay;
        limit_req_status 503;
    }
}

# 中心域名：商家后台
server {
    listen 80;
    server_name merchant.platform.test;

    location / {
        proxy_pass http://merchant_admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Subdomain "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 中心域名：平台超管后台
server {
    listen 80;
    server_name admin.platform.test;

    location / {
        proxy_pass http://platform_admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Subdomain "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}