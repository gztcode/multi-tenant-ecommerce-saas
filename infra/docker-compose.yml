x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      # 宿主机端口默认 15432：本机 5432 已被另一个项目的 postgres 容器占用
      # 绑回环：本机开发（api/.env、e2e、psql）都走 localhost，局域网不可见
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化时以超级用户装 pg_trgm 等扩展。
      # 迁移里的 CREATE EXTENSION 在托管数据库上会因权限不足失败，
      # 提前到建库阶段解决——详见该 SQL 文件里的注释。
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
      # 阶段 11：statement_timeout 等运行时调优（只在数据卷首次创建时执行；
      # 已有库见 docs/DEPLOY.md 的手动 ALTER 步骤）
      - ./postgres/init-tuning.sh:/docker-entrypoint-initdb.d/init-tuning.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-ecommerceRedis163}
    environment:
      # healthcheck 的 redis-cli 要用同一把密码（容器内读）
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ecommerceRedis163}
    ports:
      # 宿主机端口 16380：本机标准端口 6379 已被其他项目栈占用
      # 绑回环：宿主机侧脚本与本地 api 直连走 localhost；防护为 requirepass + 仅本机可达
      - '127.0.0.1:${REDIS_PORT:-16380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      # $$ 是 compose 转义：这里还原成容器内的字面 $
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
    mem_limit: 256m

  minio:
    # ⚠️ 为什么不是官方的 minio/minio：
    #
    # MinIO 社区版已经停止维护，官方容器镜像先后从两个 registry 消失——
    # 2026-09-11 `minio/minio` 从 Docker Hub 删除（拉取报 "not found"），
    # 2026-09-24 `quay.io/minio/minio` 也改为要求认证（拉取报 401）。
    # 最后那个社区版还带 CVE-2026-40344（认证绕过），钉老版本不是好答案。
    #
    # 这里用 Chainguard 从源码重建的 MinIO：API 与数据格式兼容，
    # 无 shell 之外无多余依赖，S3 接口一致。
    # 该 registry 只有 latest 一个 tag；用 digest 锁定到当前验证过的构建。
    # digest 来源：2026-11-04 `docker image inspect` 的 RepoDigests。
    image: cgr.dev/chainguard/minio@sha256:ad134b2dd572ae0d989d6807c3e45516cc75a34883a8021db2ff04be5d1d496a
    container_name: ecommerce-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ecommerce}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ecommerce-minio-secret}
      # 浏览器直传要跨域。镜像里没有 mc 可以改服务端配置，只能走环境变量。
      # 多个来源用英文逗号分隔。
      # ⚠️ **变量名必须是 MINIO_API_CORS_ALLOW_ORIGIN**（审计 P1-4）：
      #    写成 MINIO_CORS_ALLOW_ORIGIN 会被 MinIO **静默忽略** →
      #    回落到「反射任意 Origin + Allow-Credentials: true」→ 白名单形同虚设。
      #    （当年那句「实测该变量对预检请求生效」正是变量名写错时的假象。）
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost}
    ports:
      # 默认只绑本机回环；局域网访问显式设置 BIND_HOST=0.0.0.0
      - '${BIND_HOST:-127.0.0.1}:${MINIO_PORT:-19000}:9000'
      # 控制台端口，与 API 端口不同（只绑本机回环）
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      # 必须挂 volume：不挂时 /data 在容器可写层上，MinIO 启动会报
      # "Rename across devices not allowed"（.minio.sys/tmp 跨设备重命名）。
      - minio-data:/data
    healthcheck:
      # 这个镜像里没有 mc / curl / wget / nc，只有 bash 与 coreutils。
      # 用 bash 内置的 /dev/tcp 探活：连得上 9000 端口就算就绪。
      # 注意 CMD-SHELL 默认走 /bin/sh，sh 没有 /dev/tcp，必须显式调 bash。
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/9000"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    mem_limit: 1g

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: ecommerce-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 容器之间用服务名 + 容器内端口通信，与宿主机映射的 15432 无关。
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@postgres:5432/${POSTGRES_DB:-ecommerce}?schema=public
      DATABASE_URL_TEST: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@postgres:5432/ecommerce_test?schema=public
      # Redis（BullMQ 队列）。容器内走服务名 redis，与宿主机映射的 16380 无关。
      REDIS_URL: redis://:${REDIS_PASSWORD:-ecommerceRedis163}@redis:6379
      NODE_ENV: production
      PORT: '3000'
      API_PREFIX: api/v1
      # 本地开发用的固定值。必须固定：每次 up 都换密钥的话，
      # 之前签发的 token 会全部失效，调试时登录状态莫名其妙丢失。
      # 同时受两项约束：长度 ≥ 32 字符；不能等于 .env.example 里的占位符
      # （api/src/common/config/assert-secure-config.ts 会在启动时拒绝）。
      # 这里的值只服务于本机开发，真实部署必须换成随机密钥。
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-at-least-32-chars-long}
      # 收款账户与出款单快照的字段加密密钥。
      # ⚠️ 必须是**固定值**：每次 up 都换密钥的话，
      # 之前签发的出款单快照就全解不开了（与 JWT_SECRET 同款理由）。
      PAYOUT_ACCOUNT_ENCRYPTION_KEY: ${PAYOUT_ACCOUNT_ENCRYPTION_KEY:-local-dev-only-payout-encryption-key-at-least-32-chars}
      JWT_EXPIRES_IN: 2h
      REFRESH_TOKEN_TTL_DAYS: '30'
      # MinIO（媒体上传）。三个 endpoint 各管各的，含义见 api/.env.example。
      # ⚠️ MINIO_ENDPOINT 必须是**宿主机**地址（localhost:19000）：
      # 它会被签进 presigned URL，浏览器要能访问。浏览器跑在宿主机上，
      # localhost:19000 正好是宿主机映射的端口。
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://localhost:19000}
      # 后端自己 HEAD / 删除对象用的地址：容器内走服务名。
      MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      # 媒体对外访问地址（存进 media.url），浏览器要能访问。
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:19000}
      MINIO_BUCKET: ${MINIO_BUCKET:-ecommerce-media}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      # ⚠️ 这里复用了 root 凭据，仅供本机开发。真实部署要换成独立的
      # 非 root 账号——root 账号能删 bucket、能改服务配置，泄露的代价远高于
      # 一个只能读写指定 bucket 的账号。
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ecommerce}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ecommerce-minio-secret}
      MEDIA_MAX_SIZE: ${MEDIA_MAX_SIZE:-5242880}
      # ---- 支付 / 出款渠道（阶段 6a）----
      # ⚠️ 这里**故意不设置** PAYMENT_ENABLED_CHANNELS / PAYOUT_ENABLED_CHANNELS：
      #    NODE_ENV=production 时启用 fake / fake-payout 会让 api 启动即失败
      #    （假网关是安全边界，不是便利开关）。本机开发要用假网关时，
      #    在 `npm run start:dev` 的 api/.env 里设置即可，不要写到这里。
      # 生产部署必须显式给出真实渠道的启用列表，并保证每个渠道都有已部署实现，
      # 否则启动校验会点名变量与渠道名硬失败。
      # 平台默认出款渠道优先读 platform_settings（平台后台），
      # PAYOUT_PLATFORM_DEFAULT_CHANNEL 只是 DB 无行时的兜底，生产允许不设。
      # CHANNEL_MODE=sandbox 在生产环境同样会拒绝启动。
      # ---- 可观测性（阶段 11）----
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 渠道告警 webhook（飞书/钉钉/自建值班群）。不配则告警只落日志。
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-generic}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    healthcheck:
      # 用 node 自带的 fetch 探活：运行阶段没有 curl / wget，
      # node 22 的 fetch 不需要额外依赖。
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    mem_limit: 1g

  storefront:
    build:
      # ⚠️ **context 是仓库根**：共享包 `packages/frontend-shared` 是 `file:`
      #    依赖，Dockerfile 要连它一起 COPY —— 单端目录做 context 会装出
      #    断链软链，构建时共享包的 import 一条都解析不了。
      context: ..
      dockerfile: storefront/Dockerfile
      args:
        # NEXT_PUBLIC_* 在构建期被内联进产物，必须通过 build arg 传入。
        NEXT_PUBLIC_TENANT_SUBDOMAIN: ${NEXT_PUBLIC_TENANT_SUBDOMAIN:-demo}
    container_name: ecommerce-storefront
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # 容器内走服务名，不走宿机的 localhost:3000。
      API_BASE_URL: http://api:3000/api/v1
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-only-auth-secret-at-least-32-chars}
      AUTH_URL: http://localhost:3001
      AUTH_TRUST_HOST: 'true'
    ports:
      - '127.0.0.1:${STOREFRONT_PORT:-3001}:3000'
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    mem_limit: 512m

  merchant-admin:
    build:
      # context 是仓库根：共享包是 file: 依赖，要连它一起 COPY（见 storefront）。
      context: ..
      dockerfile: merchant-admin/Dockerfile
    container_name: ecommerce-merchant-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:3000/api/v1
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-only-auth-secret-at-least-32-chars}
      AUTH_URL: http://localhost:3002
      AUTH_TRUST_HOST: 'true'
    ports:
      - '127.0.0.1:${MERCHANT_ADMIN_PORT:-3002}:3000'
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    mem_limit: 512m

  platform-admin:
    build:
      # context 是仓库根：共享包是 file: 依赖，要连它一起 COPY（见 storefront）。
      context: ..
      dockerfile: platform-admin/Dockerfile
    container_name: ecommerce-platform-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:3000/api/v1
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-only-auth-secret-at-least-32-chars}
      AUTH_URL: http://localhost:3003
      AUTH_TRUST_HOST: 'true'
    ports:
      - '127.0.0.1:${PLATFORM_ADMIN_PORT:-3003}:3000'
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    mem_limit: 512m

  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      storefront:
        condition: service_healthy
      merchant-admin:
        condition: service_healthy
      platform-admin:
        condition: service_healthy
    ports:
      - '${BIND_HOST:-127.0.0.1}:${NGINX_PORT:-80}:80'
    volumes:
      - ./nginx/platform.test.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *default-logging
    healthcheck:
      # ⚠️ 必须带 Host：默认 server 块对未知 Host 直接 return 444，
      #    不带 Host 的探活会被判失败。实测带 Host 返回可接受状态。
      test:
        [
          'CMD-SHELL',
          "wget -q -O /dev/null --header='Host: demo.platform.test' http://127.0.0.1/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m

  # 数据库迁移工具（阶段 11：部署加固）。
  #
  # ⚠️ **为什么需要它**：api 的 runner 镜像只装生产依赖，而 prisma CLI
  #    是 devDependency——生产容器里跑不了 `prisma migrate deploy`。
  #    这个服务复用 api 的 **builder 阶段**（有完整 devDependencies + 源码），
  #    平时不启动（profiles: tools），升级时显式执行：
  #      docker compose --profile tools run --rm migrate
  #
  # 迁移策略：**迁移先行、应用后滚**。先跑本服务把库迁到位，
  # 再重启 api（应用代码要兼容旧库结构才能安全滚动——本项目的迁移
  # 都是加列/加索引类，兼容性成立；做破坏性迁移时要走 DEPLOY.md 的双阶段流程）。
  migrate:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: builder
    profiles: ['tools']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@postgres:5432/${POSTGRES_DB:-ecommerce}?schema=public
    command: ['npx', 'prisma', 'migrate', 'deploy']

volumes:
  pgdata:
  minio-data:
  redis-data:
