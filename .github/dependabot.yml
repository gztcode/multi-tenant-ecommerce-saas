# Dependabot：只开 npm 生态的每周更新。
#
# 本仓是 npm workspaces 单仓（根一份 package-lock.json，六个工作区共用），
# 根目录一个 directory 就能覆盖全部工作区的依赖，不需要逐个工作区列一遍。
#
# 只开 npm：GitHub Actions 等其他生态本轮不在范围内（见 PR 正文「没做的事」）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # prefix 保留英文 type，便于按 conventional commits 统一检索；
      # **人工提交**仍按本仓约定用简体中文正文。
      # ⚠️ dependabot 自动生成的 PR 说明（"Bump x from a to b"）是工具默认的英文模板，
      #    commit-message 只能定制 prefix / scope，改不了那段正文 —— 需要中文说明时人工改写。
      prefix: "chore(deps): "
      prefix-development: "chore(deps-dev): "
