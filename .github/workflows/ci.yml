name: CI

# 本机 git 直连不可达时，推送走 Git Data API；该方式现已能触发 push 事件。
# workflow_dispatch 保留为手动重跑入口。
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 16380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:15432/ecommerce?schema=public
      DATABASE_URL_TEST: postgresql://ecommerce:ecommerce@localhost:15432/ecommerce_test?schema=public
      REDIS_URL: redis://localhost:16380
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      PAYOUT_ACCOUNT_ENCRYPTION_KEY: ci-only-payout-encryption-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ⚠️ 必须 ≥24.9：NestJS 12 全家是 ESM-only，Jest 走 require(esm) 需要
          #    vm.SourceTextModule.prototype.hasAsyncGraph（Node 22 没有这个 API）。
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install -g npm@11
      - name: Install pg_trgm (迁移需要，service 容器无 init SQL)
        run: docker exec ${{ job.services.postgres.id }} psql -U ecommerce -d ecommerce -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
      # ⚠️ workspaces：单根 lockfile，只装 api 这个工作区（其余端不装，省时长）
      - run: npm ci --workspace api
      # ⚠️ 先显式生成 Prisma Client，再类型检查：
      #    npm ci 时 @prisma/client 的 postinstall 可能生成，
      #    但那是隐式行为，干净检出时不能依赖。
      - run: npx prisma generate
        working-directory: api
      - run: npx tsc --noEmit
        working-directory: api
      - run: npm run lint
        working-directory: api
      - run: npm test
        working-directory: api

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: storefront
            tenant_subdomain: demo
          - project: merchant-admin
            tenant_subdomain: ''
          - project: platform-admin
            tenant_subdomain: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install -g npm@11
      - run: npm ci --workspace ${{ matrix.project }}
      - run: npx tsc --noEmit
        working-directory: ${{ matrix.project }}
      - run: npm test
        working-directory: ${{ matrix.project }}
      - run: npm run lint
        working-directory: ${{ matrix.project }}
      - run: npm run build
        working-directory: ${{ matrix.project }}
        env:
          NEXT_PUBLIC_TENANT_SUBDOMAIN: ${{ matrix.tenant_subdomain }}
          # auth.ts 模块顶层读 AUTH_SECRET，构建期预渲染用到 auth() 的路由会 MissingSecret
          AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET || 'ci-auth-secret-with-enough-entropy' }}
          AUTH_TRUST_HOST: 'true'

  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install -g npm@11
      - run: npm ci --workspace @ecom/frontend-shared
      - run: npx tsc --noEmit
        working-directory: packages/frontend-shared

  docs-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 与 gztcode/picknote 共用同一份 `scripts/check-docs-links.py`：
      # 两仓 CI 都用 `scripts/check-docs-links.py.sha256` 钉住脚本内容，
      # **改脚本必须同步改 .sha256**，否则这里会因 checksum 不匹配直接红。
      # 固定 python 3.12，与 picknote 用同一个解释器，链接统计口径才可比。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 校验共享脚本 sha256：脚本被单边改动（未同步 .sha256）时先红在这里。
      # ⚠️ 不许加 `|| true` / `continue-on-error`：校验和死链都必须让 PR 变红。
      - run: shasum -a 256 -c scripts/check-docs-links.py.sha256
      - run: python3 scripts/check-docs-links.py --all

  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 生产 nginx 模板 + metrics 白名单脚本的渲染测试（node:test，无 npm 依赖）。
      # ⚠️ 不许加 `|| true` / `continue-on-error`：这个 job 存在的意义就是让
      #    模板或白名单脚本改坏时 CI 变红。ubuntu runner 自带 docker，
      #    用例里的 `nginx -t` 会真跑（本地没 docker 时才跳过）。
      - run: node --test infra/nginx/prod-conf.render.test.mjs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 16380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # ⚠️ **连接池不再显式放大**：阶段 10 修了根因 ——
      #    交互事务独占一条连接，回调内再用非事务客户端会再借一条，
      #    2 核 runner 上默认池只有 5 条，5 个并发下单就把池打满互相等死
      #    （P2024，随后外层事务超时报 P2028）。
      #    现在事务内的查询全部走事务客户端，一个事务只占一条连接，
      #    不再依赖池的大小 —— 所以这里用**默认池**跑，
      #    正是为了持续验证「根因已修」。
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:15432/ecommerce_test?schema=public
      DATABASE_URL_TEST: postgresql://ecommerce:ecommerce@localhost:15432/ecommerce_test?schema=public
      REDIS_URL: redis://localhost:16380
      BULLMQ_PREFIX: bull-e2e
      JWT_SECRET: ci-jwt-secret-with-enough-entropy-0123456789
      PAYOUT_ACCOUNT_ENCRYPTION_KEY: ci-payout-encryption-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ⚠️ 必须 ≥24.9：同 api job，Jest 加载 NestJS 12 的 ESM 包依赖 require(esm)。
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install -g npm@11
      - run: npm ci --workspace api
      - run: npx prisma generate
        working-directory: api
      # Prisma 会自动创建 ecommerce_test，再装迁移需要的扩展
      - run: npx prisma migrate deploy
        working-directory: api
      - name: Install pg_trgm (e2e 测试库)
        run: docker exec ${{ job.services.postgres.id }} psql -U ecommerce -d ecommerce_test -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
      # media 套件（18 条）会真实 PUT 到 MinIO，所以 CI 也要起一个真 MinIO。
      # ⚠️ 用 `docker run` 而不是 services：services 的 options 只能透传 docker create
      #    参数，没法表达「给 /data 挂 tmpfs」，而 MinIO 在跨设备的 /data 上初始化会因
      #    `rename .minio.sys/tmp` 失败直接退出（匿名卷落在容器可写层时就是这样）。
      #    `--tmpfs /data` 提供单文件系统；2026-11-19 用下面这条命令在本机跑通，
      #    对接它的 media 套件 18/18 通过。
      - name: 启动 MinIO（media e2e 依赖）
        run: |
          docker run -d --name ci-minio --tmpfs /data \
            -e MINIO_ROOT_USER=ecommerce \
            -e MINIO_ROOT_PASSWORD=ecommerce-minio-secret \
            -p 19000:9000 \
            cgr.dev/chainguard/minio@sha256:ad134b2dd572ae0d989d6807c3e45516cc75a34883a8021db2ff04be5d1d496a \
            server /data --console-address ":9001"
          # ⚠️ 就绪探针失败必须让本步直接红：MinIO 没起来时 media 会集体报错，
          #    若只在测试里失败容易被当成偶发；这里顺手把容器日志打出来。
          for i in $(seq 1 30); do
            curl -fsS http://localhost:19000/minio/health/live >/dev/null && exit 0
            sleep 1
          done
          echo "MinIO 未在 30 秒内就绪" >&2
          docker logs ci-minio >&2
          exit 1
      - run: npm run test:e2e
        working-directory: api

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install -g npm@11
      # ⚠️ workspaces：漏洞扫描只需要根 devDependencies 里的 audit-ci（44 个包），
      #    不必装全部工作区依赖。
      #    --ignore-scripts：扫描不依赖任何 postinstall。
      - run: npm ci --workspaces=false --ignore-scripts
      # ⚠️ 必须显式指定 registry：audit-ci 走 npm audit 的批量漏洞接口，
      #    国内镜像（mirrors.cloud.tencent.com / npmmirror）没有这个接口，
      #    会报 "Invocation of npm audit failed" 直接红。
      # ⚠️ 卡门策略与白名单都在 .github/audit-ci.jsonc（进版本库，可评审）：
      #    只对 high / critical 卡门，moderate 及以下只报告、不失败。
      - run: npx audit-ci --config .github/audit-ci.jsonc --registry=https://registry.npmjs.org

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 16380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install -g npm@11
      # 浏览器 e2e 用独立库 ecommerce_browser（避免测试库的历史出款快照触发密钥自检失败）
      - run: docker exec ${{ job.services.postgres.id }} psql -U ecommerce -d postgres -c 'CREATE DATABASE ecommerce_browser;'
      - run: docker exec ${{ job.services.postgres.id }} psql -U ecommerce -d ecommerce_browser -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
      - run: npm ci
      - run: npm run prisma:generate --workspace api
      - run: npx playwright install --with-deps chromium
      - run: npm test --workspace @ecom/browser-e2e
