name: CI

# 本机 git 直连不可达时，推送走 Git Data API；该方式现已能触发 push 事件。
# workflow_dispatch 保留为手动重跑入口。
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 16380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:15432/ecommerce?schema=public
      DATABASE_URL_TEST: postgresql://ecommerce:ecommerce@localhost:15432/ecommerce_test?schema=public
      REDIS_URL: redis://localhost:16380
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      PAYOUT_ACCOUNT_ENCRYPTION_KEY: ci-only-payout-encryption-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm install -g npm@11
      - name: Install pg_trgm (迁移需要，service 容器无 init SQL)
        run: docker exec ${{ job.services.postgres.id }} psql -U ecommerce -d ecommerce -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
      - run: npm ci
        working-directory: api
      # ⚠️ 先显式生成 Prisma Client，再类型检查：
      #    npm ci 时 @prisma/client 的 postinstall 可能生成，
      #    但那是隐式行为，干净检出时不能依赖。
      - run: npx prisma generate
        working-directory: api
      - run: npx tsc --noEmit
        working-directory: api
      - run: npm run lint
        working-directory: api
      - run: npm test
        working-directory: api

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: storefront
            tenant_subdomain: demo
          - project: merchant-admin
            tenant_subdomain: ''
          - project: platform-admin
            tenant_subdomain: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ${{ matrix.project }}/package-lock.json
            packages/frontend-shared/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
        working-directory: packages/frontend-shared
      - run: npm ci
        working-directory: ${{ matrix.project }}
      - run: npx tsc --noEmit
        working-directory: ${{ matrix.project }}
      - run: npm test
        working-directory: ${{ matrix.project }}
      - run: npm run lint
        working-directory: ${{ matrix.project }}
      - run: npm run build
        working-directory: ${{ matrix.project }}
        env:
          NEXT_PUBLIC_TENANT_SUBDOMAIN: ${{ matrix.tenant_subdomain }}
          # auth.ts 模块顶层读 AUTH_SECRET，构建期预渲染用到 auth() 的路由会 MissingSecret
          AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET || 'ci-auth-secret-with-enough-entropy' }}
          AUTH_TRUST_HOST: 'true'

  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/frontend-shared/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
        working-directory: packages/frontend-shared
      - run: npx tsc --noEmit
        working-directory: packages/frontend-shared

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 16380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # ⚠️ **必须显式放大连接池**：GitHub 2 核 runner 的 Prisma 默认池只有 5
      #    （CPU×2+1）。5 个并发下单各占一条事务连接，事务内的
      #    `this.prisma.databaseNow()` 又要再借一条 → 池被打满互相等 → P2024。
      #    本地核多（池 ~21）所以复现不出来。
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:15432/ecommerce_test?schema=public&connection_limit=20&pool_timeout=20
      DATABASE_URL_TEST: postgresql://ecommerce:ecommerce@localhost:15432/ecommerce_test?schema=public&connection_limit=20&pool_timeout=20
      REDIS_URL: redis://localhost:16380
      BULLMQ_PREFIX: bull-e2e
      # CI 的 2 核 runner 上，5 个并发下单会在同一行 SKU 锁上排队，
      # 10 秒的交互事务预算不够（Prisma P2028）。只在 e2e 放宽，生产不设。
      PRISMA_TX_TIMEOUT_MS: '30000'
      JWT_SECRET: ci-jwt-secret-with-enough-entropy-0123456789
      PAYOUT_ACCOUNT_ENCRYPTION_KEY: ci-payout-encryption-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
        working-directory: api
      - run: npx prisma generate
        working-directory: api
      # Prisma 会自动创建 ecommerce_test，再装迁移需要的扩展
      - run: npx prisma migrate deploy
        working-directory: api
      - name: Install pg_trgm (e2e 测试库)
        run: docker exec ${{ job.services.postgres.id }} psql -U ecommerce -d ecommerce_test -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
      # media 套件依赖 MinIO，CI 不启动 MinIO，只排除这一套
      - run: npm run test:e2e -- --testPathIgnorePatterns=media.e2e-spec.ts
        working-directory: api
